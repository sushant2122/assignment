services:
  backend:
    build: .
    depends_on:
      - db
    volumes:
      - ./secrets/password.txt:/run/secrets/db-password:ro

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: example
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: PassSus
    expose:
      - "5432"

  proxy:
    image: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend

